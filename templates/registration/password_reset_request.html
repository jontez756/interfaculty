{% extends 'base.html' %}
{% load static %}

{% block content %}
<style>
    .reset-container {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        padding: 20px;
    }
    .reset-card {
        background: white;
        border-radius: 20px;
        box-shadow: 0 20px 40px rgba(0,0,0,0.2);
        padding: 40px;
        width: 100%;
        max-width: 450px;
        text-align: center;
    }
    .reset-card h2 {
        color: #333;
        margin-bottom: 10px;
    }
    .reset-card p {
        color: #666;
        margin-bottom: 25px;
    }
    .form-group {
        margin-bottom: 20px;
        text-align: left;
    }
    .form-label {
        display: block;
        margin-bottom: 5px;
        font-weight: 600;
        color: #333;
    }
    .form-control {
        width: 100%;
        height: 45px;
        padding: 0 15px;
        border: 2px solid #e0e0e0;
        border-radius: 8px;
        font-size: 14px;
    }
    .form-control:focus {
        outline: none;
        border-color: #667eea;
    }
    .btn-send {
        width: 100%;
        height: 45px;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        border: none;
        border-radius: 8px;
        font-weight: 600;
        cursor: pointer;
        transition: transform 0.2s;
    }
    .btn-send:hover {
        transform: translateY(-2px);
    }
    .back-link {
        margin-top: 20px;
        display: block;
        color: #667eea;
        text-decoration: none;
    }
    .alert-success {
        background: #d4edda;
        color: #155724;
        padding: 12px;
        border-radius: 8px;
        margin-bottom: 20px;
    }
    .alert-error {
        background: #f8d7da;
        color: #721c24;
        padding: 12px;
        border-radius: 8px;
        margin-bottom: 20px;
    }
</style>

<div class="reset-container">
    <div class="reset-card">
        <h2>Reset Password</h2>
        <p>Enter your email address and we'll send you a verification code</p>
        
        {% if messages %}
            {% for message in messages %}
                <div class="alert-{% if message.tags == 'success' %}success{% else %}error{% endif %}">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}
        
        <form method="post">
            {% csrf_token %}
            <div class="form-group">
                <label class="form-label">Email Address</label>
                {{ form.email }}
            </div>
            <button type="submit" class="btn-send">Send Verification Code</button>
        </form>
        <a href="{% url 'login' %}" class="back-link">← Back to Login</a>
    </div>
</div>
{% endblock %}
